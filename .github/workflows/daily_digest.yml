name: 🤖 AI News Daily Digest

# ────────────────────────────────────────────────────────────────────
# WHEN does this run?
#
#   1. Automatically every day at 8:00 AM IST
#      IST = UTC + 5:30  →  8:00 AM IST = 2:30 AM UTC
#      Cron format: minute  hour  day  month  weekday
#
#   2. Manually — click "Run workflow" button in the
#      GitHub → Actions → AI News Daily Digest tab
# ────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 2 * * *'    # 2:00 AM UTC = 7:30 AM IST (accounts for GitHub queue delay -> lands ~8:00 AM IST)

  workflow_dispatch:        # allows clicking "Run workflow" in GitHub UI


jobs:
  run-pipeline:
    name: Run AI News Pipeline
    runs-on: ubuntu-latest   # free Linux VM provided by GitHub
    timeout-minutes: 30      # safety: kill the job if it hangs > 30 min

    steps:

      # ── Step 1: Get your code ─────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install Python ────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # caches downloaded packages → faster runs

      # ── Step 3: Install project dependencies ─────────────────────
      - name: 📦 Install dependencies
        run: pip install -r server/requirements.txt

      # ── Step 4: Debug — verify secrets are loaded ─────────────────
      - name: 🔍 Verify secrets are loaded
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT is EMPTY — secret is missing or blank"
            echo "Go to: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          else
            echo "✅ FIREBASE_SERVICE_ACCOUNT is set (length=${#FIREBASE_SERVICE_ACCOUNT} chars)"
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "❌ RESEND_API_KEY is EMPTY — secret is missing or blank"
            echo "Get one at https://resend.com/api-keys and add it as a repository secret"
            exit 1
          else
            echo "✅ RESEND_API_KEY is set (length=${#RESEND_API_KEY} chars)"
          fi

      # ── Step 5: Run the full pipeline ────────────────────────────
      # Same single command you run locally — server.py is the entry point.
      # All settings come from environment variables (GitHub secrets).
      - name: 🚀 Run pipeline
        env:
          # ── Firebase (dedup store / blogs / subscribers) ──────────
          FIREBASE_PROJECT_ID:      ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          # ── Email (Resend) ───────────────────────────────────────
          # Emails are sent through the Resend API. If RESEND_TEMPLATE_ID
          # is set, the published Resend template is used; otherwise the
          # rendered HTML digest is sent directly.
          RESEND_API_KEY:      ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM:         ${{ secrets.RESEND_FROM }}
          RESEND_TEMPLATE_ID:  ${{ secrets.RESEND_TEMPLATE_ID }}

          # ── Discord (currently disabled in code) ─────────────────
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # ── Schedule (used only by the web server's scheduler) ──
          DIGEST_HOUR_IST:     '8'
          DIGEST_MINUTE_IST:   '0'

        run: python -m server.server