name: 🤖 AI News Daily Digest

# ────────────────────────────────────────────────────────────────────
# WHEN does this run?
#
#   1. Automatically every day at 8:00 AM IST
#      IST = UTC + 5:30  →  8:00 AM IST = 2:30 AM UTC
#      Cron format: minute  hour  day  month  weekday
#
#   2. Manually — click "Run workflow" button in the
#      GitHub → Actions → AI News Daily Digest tab
# ────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 2 * * *'    # 2:00 AM UTC = 7:30 AM IST (accounts for GitHub queue delay -> lands ~8:00 AM IST)

  workflow_dispatch:        # allows clicking "Run workflow" in GitHub UI


jobs:
  run-pipeline:
    name: Run AI News Pipeline
    runs-on: ubuntu-latest   # free Linux VM provided by GitHub
    timeout-minutes: 30      # safety: kill the job if it hangs > 30 min

    steps:

      # ── Step 1: Get your code ─────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install Python ────────────────────────────────────
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # caches downloaded packages → faster runs

      # ── Step 3: Install project dependencies ─────────────────────
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # ── Step 4: Debug — verify secrets are loaded ─────────────────
      - name: 🔍 Verify secrets are loaded
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL is EMPTY — secret is missing or blank"
            echo "Go to: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          else
            echo "✅ DATABASE_URL is set (length=${#DATABASE_URL} chars)"
          fi

      # ── Step 5: Set up the database tables (safe to run every time)
      - name: 🗄️ Initialise database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python setup_db.py

      # ── Step 6: Run the full pipeline ────────────────────────────
      - name: 🚀 Run pipeline
        env:
          # ── Database ──────────────────────────────────────────────
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}

          # ── Email ─────────────────────────────────────────────────
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS:    ${{ secrets.RECIPIENT_EMAILS }}

          # ── Discord ───────────────────────────────────────────────
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # ── Schedule (informational only — not used in main.py) ───
          DIGEST_HOUR_IST:     '8'
          DIGEST_MINUTE_IST:   '0'

          # ── LLM (optional — remove the # if you add Gemini back) ─
          # GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}

        run: python main.py
